<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Membership Plans — Sagar Fitness Gym</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 min-h-screen flex text-slate-800">
  <!-- Shared Sidebar Container -->
  <div id="sidebar-container"></div>

  <!-- Main Content Wrapper -->
  <div class="flex-1 flex flex-col min-w-0 h-screen overflow-y-auto">
    <!-- Shared Top Navbar Container -->
    <div id="navbar-container"></div>

    <!-- Page Body -->
    <main class="flex-1 p-4 sm:p-6 md:p-8 max-w-7xl w-full mx-auto pb-24 lg:pb-12 space-y-6">
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div>
          <h1 class="text-xl sm:text-2xl font-black text-slate-900 tracking-tight">Membership Packages & Plans</h1>
          <p class="text-xs sm:text-sm text-slate-500 font-medium mt-0.5">Configure gym packages, pricing, durations and benefits</p>
        </div>
        <div>
          <button onclick="openAddPlanModal()" class="w-full sm:w-auto px-4 py-2.5 bg-purple-600 hover:bg-purple-700 active:bg-purple-800 text-white font-bold text-xs rounded-xl shadow-md transition-all flex items-center justify-center gap-2 cursor-pointer">
            <i data-lucide="plus" class="w-4 h-4"></i>
            <span>Add New Package</span>
          </button>
        </div>
      </div>

      <!-- Plans Cards Grid -->
      <div id="plans-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
        <p class="text-slate-400 py-12 text-center col-span-3">Loading membership plans...</p>
      </div>
    </main>
  </div>

  <!-- Shared Mobile Bottom Navigation Container -->
  <div id="mobile-nav-container"></div>

  <!-- Add / Edit Plan Modal -->
  <div id="plan-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 modal-backdrop">
    <div class="w-full max-w-md bg-white border border-slate-200 rounded-2xl shadow-2xl p-6 space-y-4 modal-enter">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <h3 class="text-base font-bold text-slate-900" id="plan-modal-title">Create Membership Package</h3>
        <button type="button" onclick="closePlanModal()" class="p-1 text-slate-400 hover:text-slate-600">✕</button>
      </div>

      <form onsubmit="handlePlanSubmit(event)" class="space-y-3">
        <input type="hidden" id="plan-edit-id">

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Package Name *</label>
          <input type="text" id="plan-name" required placeholder="e.g. 1 Month General Fitness" class="w-full h-10 px-3 text-xs border border-slate-300 rounded-xl focus:outline-none focus:border-purple-600">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Duration (Days) *</label>
            <input type="number" id="plan-duration" required min="1" placeholder="30" class="w-full h-10 px-3 text-xs border border-slate-300 rounded-xl focus:outline-none focus:border-purple-600">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Fee Amount (₹) *</label>
            <input type="number" id="plan-price" required min="0" placeholder="1000" class="w-full h-10 px-3 text-xs border border-slate-300 rounded-xl focus:outline-none focus:border-purple-600">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Description</label>
          <textarea id="plan-desc" rows="3" placeholder="Includes cardio, weights and training regimen..." class="w-full p-3 text-xs border border-slate-300 rounded-xl focus:outline-none focus:border-purple-600"></textarea>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Status</label>
          <select id="plan-status" class="w-full h-10 px-3 text-xs border border-slate-300 rounded-xl bg-white focus:outline-none focus:border-purple-600 font-semibold">
            <option value="true">Active (Accepting new sign-ups)</option>
            <option value="false">Inactive (Disabled / Hidden for new sign-ups)</option>
          </select>
        </div>

        <button type="submit" id="plan-submit-btn" class="w-full h-10 bg-purple-600 hover:bg-purple-700 text-white font-bold text-xs rounded-xl shadow-md transition-all">
          Save Package
        </button>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/components.js"></script>
  <script>
    let allPlans = [];

    document.addEventListener('DOMContentLoaded', () => {
      if (!Auth.requireAdmin()) return;
      loadPlans();
    });

    async function loadPlans() {
      const grid = document.getElementById('plans-grid');
      try {
        const res = await API.getPlans();
        allPlans = Array.isArray(res) ? res : (res.plans || []);

        if (allPlans.length === 0) {
          grid.innerHTML = `<p class="text-slate-400 py-12 text-center col-span-3">No membership packages configured yet.</p>`;
          return;
        }

        grid.innerHTML = allPlans.map(p => {
          const isActive = p.active !== false;
          return `
          <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm hover:shadow-md transition-all flex flex-col justify-between">
            <div>
              <div class="flex items-center justify-between">
                <span class="px-2.5 py-1 rounded-full text-[10px] font-bold bg-purple-50 text-purple-800 border border-purple-200">
                  ${p.durationDays || p.duration || 30} DAYS
                </span>
                <button type="button" onclick="togglePlanStatus('${p._id}', ${isActive})" title="Click to toggle Active/Inactive" class="px-2.5 py-1 rounded-full text-[11px] font-bold transition-all cursor-pointer flex items-center gap-1.5 shadow-2xs ${
                  isActive
                    ? 'bg-emerald-50 text-emerald-700 border border-emerald-200 hover:bg-emerald-100'
                    : 'bg-slate-100 text-slate-500 border border-slate-300 hover:bg-slate-200'
                }">
                  <span class="w-1.5 h-1.5 rounded-full ${isActive ? 'bg-emerald-500' : 'bg-slate-400'}"></span>
                  <span>${isActive ? 'Active' : 'Inactive'}</span>
                </button>
              </div>

              <h3 class="text-base font-bold text-slate-900 mt-3">${p.name}</h3>
              <p class="text-xs text-slate-500 mt-1 line-clamp-2">${p.description || 'Full gym facility access'}</p>

              <div class="mt-4 pt-3 border-t border-slate-100 flex items-baseline gap-1">
                <span class="text-2xl font-black text-slate-900">${formatINR(p.price)}</span>
                <span class="text-[11px] text-slate-400 font-semibold">/ term</span>
              </div>
            </div>

            <div class="mt-5 pt-3 border-t border-slate-100 flex items-center justify-between">
              <button type="button" onclick="togglePlanStatus('${p._id}', ${isActive})" class="text-[11px] font-bold transition-colors cursor-pointer ${
                isActive ? 'text-amber-600 hover:text-amber-700' : 'text-emerald-600 hover:text-emerald-700'
              }">
                ${isActive ? 'Deactivate' : 'Activate'}
              </button>
              <div class="flex items-center gap-2">
                <button onclick="openEditPlanModal('${p._id}')" class="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-xs font-bold text-slate-700 transition-colors cursor-pointer">
                  Edit
                </button>
                <button onclick="deletePlan('${p._id}')" title="Delete Plan" class="p-1.5 text-rose-500 hover:bg-rose-50 rounded-lg transition-colors cursor-pointer">
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
              </div>
            </div>
          </div>
        `}).join('');

        if (window.lucide) lucide.createIcons();
      } catch (err) {
        grid.innerHTML = `<p class="text-rose-500 py-12 text-center col-span-3">Failed to load packages</p>`;
      }
    }

    function openAddPlanModal() {
      document.getElementById('plan-modal-title').innerText = 'Create Membership Package';
      document.getElementById('plan-edit-id').value = '';
      document.getElementById('plan-name').value = '';
      document.getElementById('plan-duration').value = '30';
      document.getElementById('plan-price').value = '';
      document.getElementById('plan-desc').value = '';
      document.getElementById('plan-status').value = 'true';
      document.getElementById('plan-modal').classList.remove('hidden');
    }

    function openEditPlanModal(id) {
      const plan = allPlans.find(p => p._id === id);
      if (!plan) return;
      document.getElementById('plan-modal-title').innerText = 'Edit Membership Package';
      document.getElementById('plan-edit-id').value = plan._id;
      document.getElementById('plan-name').value = plan.name;
      document.getElementById('plan-duration').value = plan.durationDays || plan.duration || 30;
      document.getElementById('plan-price').value = plan.price;
      document.getElementById('plan-desc').value = plan.description || '';
      document.getElementById('plan-status').value = String(plan.active !== false);
      document.getElementById('plan-modal').classList.remove('hidden');
    }

    function closePlanModal() {
      document.getElementById('plan-modal').classList.add('hidden');
    }

    async function togglePlanStatus(id, currentActive) {
      try {
        await API.togglePlanStatus(id);
        showToast(`Package successfully ${currentActive ? 'deactivated (set to Inactive)' : 'activated (set to Active)'}!`);
        loadPlans();
      } catch (err) {
        showToast(err.message || 'Failed to update package status', 'error');
      }
    }

    async function handlePlanSubmit(e) {
      e.preventDefault();
      const id = document.getElementById('plan-edit-id').value;
      const btn = document.getElementById('plan-submit-btn');

      btn.disabled = true;
      btn.innerText = 'Saving...';

      const days = Number(document.getElementById('plan-duration').value);
      const payload = {
        name: document.getElementById('plan-name').value.trim(),
        durationDays: days,
        duration: days,
        price: Number(document.getElementById('plan-price').value),
        description: document.getElementById('plan-desc').value.trim(),
        active: document.getElementById('plan-status').value === 'true',
      };

      try {
        if (id) {
          await API.updatePlan(id, payload);
          showToast('Package updated successfully!');
        } else {
          await API.createPlan(payload);
          showToast('Package created successfully!');
        }
        closePlanModal();
        loadPlans();
      } catch (err) {
        showToast(err.message || 'Operation failed', 'error');
      } finally {
        btn.disabled = false;
        btn.innerText = 'Save Package';
      }
    }

    async function deletePlan(id) {
      if (!confirm('Are you sure you want to delete this package?')) return;
      try {
        await API.deletePlan(id);
        showToast('Package removed');
        loadPlans();
      } catch (err) {
        showToast(err.message || 'Failed to delete package', 'error');
      }
    }
  </script>
</body>
</html>
