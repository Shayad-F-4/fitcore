<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Members — Sagar Fitness Gym</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 min-h-screen flex text-slate-800">
  <!-- Shared Sidebar Container -->
  <div id="sidebar-container"></div>

  <!-- Main Content Wrapper -->
  <div class="flex-1 flex flex-col min-w-0 h-screen overflow-y-auto">
    <!-- Shared Top Navbar Container -->
    <div id="navbar-container"></div>

    <!-- Page Body -->
    <main class="flex-1 p-4 sm:p-6 md:p-8 max-w-7xl w-full mx-auto pb-24 lg:pb-12 space-y-6">
      <!-- Header Row -->
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div>
          <h1 class="text-xl sm:text-2xl font-black text-slate-900 tracking-tight">Members Directory</h1>
          <p class="text-xs sm:text-sm text-slate-500 font-medium mt-0.5">Manage athlete profiles, admissions, renewals and fees</p>
        </div>
        <div>
          <button onclick="openRegisterModal()" class="w-full sm:w-auto px-4 py-2.5 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold text-xs rounded-xl shadow-md transition-all flex items-center justify-center gap-2 cursor-pointer">
            <i data-lucide="user-plus" class="w-4 h-4"></i>
            <span>Register New Member</span>
          </button>
        </div>
      </div>

      <!-- Controls Row: Search & Status Filters -->
      <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row items-center justify-between gap-3">
        <!-- Search Input -->
        <div class="relative w-full md:w-80 flex items-center">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5"></i>
          <input type="text" id="member-search-input" oninput="handleSearchDebounce()" placeholder="Search by name, phone or ID..." class="w-full h-10 pl-10 pr-4 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:bg-white focus:border-blue-600 font-medium">
        </div>

        <!-- Filter Badges -->
        <div class="flex items-center gap-1.5 overflow-x-auto w-full md:w-auto pb-1 md:pb-0">
          <button onclick="setFilter('ALL')" id="filter-btn-ALL" class="filter-tab px-3 py-1.5 rounded-xl text-xs font-bold bg-blue-600 text-white transition-colors cursor-pointer">All</button>
          <button onclick="setFilter('ACTIVE')" id="filter-btn-ACTIVE" class="filter-tab px-3 py-1.5 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-100 transition-colors cursor-pointer">Active</button>
          <button onclick="setFilter('EXPIRING')" id="filter-btn-EXPIRING" class="filter-tab px-3 py-1.5 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-100 transition-colors cursor-pointer">Expiring</button>
          <button onclick="setFilter('EXPIRED')" id="filter-btn-EXPIRED" class="filter-tab px-3 py-1.5 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-100 transition-colors cursor-pointer">Expired</button>
          <button onclick="setFilter('FROZEN')" id="filter-btn-FROZEN" class="filter-tab px-3 py-1.5 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-100 transition-colors cursor-pointer">Frozen</button>
        </div>
      </div>

      <!-- Members Table -->
      <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs">
            <thead class="bg-slate-50 text-slate-500 font-bold uppercase border-b border-slate-100 select-none">
              <tr>
                <th class="py-3.5 px-4">Member Info</th>
                <th class="py-3.5 px-4">Contact Phone</th>
                <th class="py-3.5 px-4">Plan</th>
                <th class="py-3.5 px-4">Expiry Date</th>
                <th class="py-3.5 px-4">Status</th>
                <th class="py-3.5 px-4 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="members-table-body" class="divide-y divide-slate-100">
              <tr>
                <td colspan="6" class="py-12 text-center text-slate-400 font-medium">Loading members list...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Shared Mobile Bottom Navigation Container -->
  <div id="mobile-nav-container"></div>

  <!-- Register Member Modal -->
  <div id="register-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 modal-backdrop">
    <div class="w-full max-w-lg bg-white border border-slate-200 rounded-2xl shadow-2xl p-6 space-y-4 max-h-[90vh] overflow-y-auto modal-enter">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <h3 class="text-base font-bold text-slate-900">Register New Member Admission</h3>
        <button type="button" onclick="closeRegisterModal()" class="p-1 text-slate-400 hover:text-slate-600">✕</button>
      </div>

      <form onsubmit="handleRegisterSubmit(event)" class="space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Full Name *</label>
            <input type="text" id="reg-name" required placeholder="e.g. Rahul Sharma" class="w-full h-10 px-3 text-xs border border-slate-300 rounded-xl focus:outline-none focus:border-blue-600">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Phone Number *</label>
            <input type="tel" id="reg-phone" required placeholder="10-digit mobile" class="w-full h-10 px-3 text-xs border border-slate-300 rounded-xl focus:outline-none focus:border-blue-600">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Email (Optional)</label>
            <input type="email" id="reg-email" placeholder="rahul@gmail.com" class="w-full h-10 px-3 text-xs border border-slate-300 rounded-xl focus:outline-none focus:border-blue-600">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Gender</label>
            <select id="reg-gender" class="w-full h-10 px-3 text-xs border border-slate-300 rounded-xl focus:outline-none focus:border-blue-600 bg-white">
              <option value="MALE">Male</option>
              <option value="FEMALE">Female</option>
              <option value="OTHER">Other</option>
            </select>
          </div>
        </div>

        <!-- Plan Selection -->
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Select Membership Plan *</label>
          <select id="reg-plan" required onchange="handlePlanSelectChange()" class="w-full h-10 px-3 text-xs border border-slate-300 rounded-xl focus:outline-none focus:border-blue-600 bg-white">
            <option value="">-- Choose a Plan --</option>
          </select>
        </div>

        <!-- Fee Details -->
        <div class="p-3 bg-slate-50 border border-slate-200 rounded-xl space-y-2">
          <div class="flex justify-between text-xs font-semibold text-slate-600">
            <span>Plan Price:</span>
            <span id="reg-plan-price" class="text-slate-900 font-bold">₹0</span>
          </div>
          <div class="grid grid-cols-2 gap-2 pt-1">
            <div>
              <label class="block text-[11px] font-bold text-slate-700 mb-1">Amount Paid (₹)</label>
              <input type="number" id="reg-paid" required min="0" oninput="calculateBalance()" class="w-full h-9 px-3 text-xs border border-slate-300 rounded-lg focus:outline-none focus:border-blue-600 bg-white">
            </div>
            <div>
              <label class="block text-[11px] font-bold text-slate-700 mb-1">Payment Method</label>
              <select id="reg-method" class="w-full h-9 px-3 text-xs border border-slate-300 rounded-lg focus:outline-none focus:border-blue-600 bg-white">
                <option value="CASH">Cash</option>
                <option value="UPI">UPI</option>
                <option value="CARD">Card</option>
              </select>
            </div>
          </div>
          <div class="flex justify-between text-xs font-bold pt-1 border-t border-slate-200">
            <span>Balance Due:</span>
            <span id="reg-balance" class="text-rose-600">₹0</span>
          </div>
        </div>

        <button type="submit" id="reg-submit-btn" class="w-full h-11 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-xl shadow-md transition-all">
          Save & Register Member
        </button>
      </form>
    </div>
  </div>

  <!-- Member Profile Modal -->
  <div id="profile-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 modal-backdrop">
    <div class="w-full max-w-lg bg-white border border-slate-200 rounded-2xl shadow-2xl p-6 space-y-4 max-h-[90vh] overflow-y-auto modal-enter">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <h3 class="text-base font-bold text-slate-900">Athlete Profile</h3>
        <button type="button" onclick="closeProfileModal()" class="p-1 text-slate-400 hover:text-slate-600">✕</button>
      </div>

      <div id="profile-modal-content" class="space-y-4 text-xs">
        <p class="text-center text-slate-400 py-6">Loading details...</p>
      </div>
    </div>
  </div>

  <!-- Renew Membership Modal -->
  <div id="renew-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 modal-backdrop">
    <div class="w-full max-w-md bg-white border border-slate-200 rounded-2xl shadow-2xl p-6 space-y-4 modal-enter">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <h3 class="text-base font-bold text-slate-900">Renew Membership</h3>
        <button type="button" onclick="closeRenewModal()" class="p-1 text-slate-400 hover:text-slate-600">✕</button>
      </div>

      <form onsubmit="handleRenewSubmit(event)" class="space-y-3">
        <input type="hidden" id="renew-member-id">
        <p class="text-xs text-slate-600">Member: <strong id="renew-member-name" class="text-slate-900"></strong></p>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Select Renewal Plan *</label>
          <select id="renew-plan" required onchange="handleRenewPlanChange()" class="w-full h-10 px-3 text-xs border border-slate-300 rounded-xl bg-white focus:outline-none focus:border-blue-600">
          </select>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Amount Paid (₹)</label>
            <input type="number" id="renew-paid" required min="0" class="w-full h-10 px-3 text-xs border border-slate-300 rounded-xl bg-white focus:outline-none focus:border-blue-600">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Mode</label>
            <select id="renew-method" class="w-full h-10 px-3 text-xs border border-slate-300 rounded-xl bg-white focus:outline-none focus:border-blue-600">
              <option value="CASH">Cash</option>
              <option value="UPI">UPI</option>
              <option value="CARD">Card</option>
            </select>
          </div>
        </div>

        <button type="submit" id="renew-btn" class="w-full h-10 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow-md transition-all">
          Confirm Renewal
        </button>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/components.js"></script>
  <script>
    let currentFilter = 'ALL';
    let membersList = [];
    let plansList = [];
    let searchTimeout = null;

    document.addEventListener('DOMContentLoaded', async () => {
      await loadPlans();
      await loadMembers();

      // Check URL query for action=new
      const params = new URLSearchParams(window.location.search);
      if (params.get('action') === 'new') {
        openRegisterModal();
      }
    });

    async function loadPlans() {
      try {
        const res = await API.getPlans();
        plansList = Array.isArray(res) ? res : (res.plans || []);
        const select = document.getElementById('reg-plan');
        const renewSelect = document.getElementById('renew-plan');

        const optionsHtml = plansList.map(p => `
          <option value="${p._id}" data-price="${p.price}" data-duration="${p.duration}">
            ${p.name} — ${formatINR(p.price)} (${p.duration} Days)
          </option>
        `).join('');

        select.innerHTML = '<option value="">-- Choose a Plan --</option>' + optionsHtml;
        renewSelect.innerHTML = optionsHtml;
      } catch (err) {
        console.error('Failed to load plans:', err);
      }
    }

    async function loadMembers() {
      const search = document.getElementById('member-search-input').value.trim();
      const tbody = document.getElementById('members-table-body');

      try {
        const res = await API.getMembers(search, currentFilter);
        membersList = Array.isArray(res) ? res : (res.members || []);

        if (membersList.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" class="py-12 text-center text-slate-400 font-medium">No members found matching your search.</td></tr>`;
          return;
        }

        tbody.innerHTML = membersList.map(m => {
          const sub = m.activeMembership || {};
          const status = m.status || 'ACTIVE';
          let badgeClass = 'badge-active';
          if (status === 'EXPIRING') badgeClass = 'badge-expiring';
          if (status === 'EXPIRED') badgeClass = 'badge-expired';
          if (status === 'FROZEN') badgeClass = 'badge-frozen';

          const cleanPhone = (m.phone || '').replace(/\D/g, '');
          const waPhone = cleanPhone.startsWith('91') ? cleanPhone : `91${cleanPhone}`;
          const waUrl = `https://wa.me/${waPhone}?text=${encodeURIComponent(`Hello ${m.fullName}, greeting from Sagar Fitness Gym!`)}`;

          return `
            <tr class="hover:bg-slate-50 transition-colors">
              <td class="py-3.5 px-4">
                <div class="flex items-center gap-3">
                  <div class="w-8 h-8 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center font-bold text-xs shrink-0">
                    ${m.fullName ? m.fullName[0].toUpperCase() : 'M'}
                  </div>
                  <div>
                    <button onclick="viewMemberProfile('${m._id}')" class="font-bold text-slate-900 hover:text-blue-600 transition-colors text-left cursor-pointer">
                      ${m.fullName}
                    </button>
                    <p class="text-[10px] text-slate-400 font-mono">${m.memberId || ''}</p>
                  </div>
                </div>
              </td>
              <td class="py-3.5 px-4 font-mono text-slate-600 font-medium">${m.phone || 'N/A'}</td>
              <td class="py-3.5 px-4 font-semibold text-slate-700">${sub.plan?.name || 'General Plan'}</td>
              <td class="py-3.5 px-4 font-bold ${status === 'EXPIRING' ? 'text-amber-600' : status === 'EXPIRED' ? 'text-rose-600' : 'text-slate-700'}">
                ${formatDateIN(sub.endDate)}
              </td>
              <td class="py-3.5 px-4">
                <span class="px-2.5 py-1 rounded-full text-[10px] font-bold ${badgeClass}">${status}</span>
              </td>
              <td class="py-3.5 px-4 text-right">
                <div class="flex items-center justify-end gap-1.5">
                  <a href="${waUrl}" target="_blank" title="WhatsApp Message" class="p-1.5 text-emerald-600 hover:bg-emerald-50 rounded-lg transition-colors">
                    <i data-lucide="message-square" class="w-4 h-4"></i>
                  </a>
                  <button onclick="openRenewModal('${m._id}', '${m.fullName}')" title="Renew" class="p-1.5 text-blue-600 hover:bg-blue-50 rounded-lg transition-colors cursor-pointer">
                    <i data-lucide="rotate-cw" class="w-4 h-4"></i>
                  </button>
                  <button onclick="viewMemberProfile('${m._id}')" title="View Profile" class="p-1.5 text-slate-600 hover:bg-slate-100 rounded-lg transition-colors cursor-pointer">
                    <i data-lucide="eye" class="w-4 h-4"></i>
                  </button>
                </div>
              </td>
            </tr>
          `;
        }).join('');

        if (window.lucide) lucide.createIcons();
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-rose-500 font-semibold">Failed to load members</td></tr>`;
      }
    }

    function setFilter(status) {
      currentFilter = status;
      document.querySelectorAll('.filter-tab').forEach(btn => {
        btn.className = 'filter-tab px-3 py-1.5 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-100 transition-colors cursor-pointer';
      });
      const activeBtn = document.getElementById(`filter-btn-${status}`);
      if (activeBtn) {
        activeBtn.className = 'filter-tab px-3 py-1.5 rounded-xl text-xs font-bold bg-blue-600 text-white transition-colors cursor-pointer';
      }
      loadMembers();
    }

    function handleSearchDebounce() {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(loadMembers, 300);
    }

    // Register Modal Helpers
    function openRegisterModal() {
      document.getElementById('register-modal').classList.remove('hidden');
    }
    function closeRegisterModal() {
      document.getElementById('register-modal').classList.add('hidden');
    }

    function handlePlanSelectChange() {
      const select = document.getElementById('reg-plan');
      const opt = select.selectedOptions[0];
      const price = opt ? Number(opt.dataset.price) || 0 : 0;
      document.getElementById('reg-plan-price').innerText = formatINR(price);
      document.getElementById('reg-paid').value = price;
      calculateBalance();
    }

    function calculateBalance() {
      const select = document.getElementById('reg-plan');
      const opt = select.selectedOptions[0];
      const price = opt ? Number(opt.dataset.price) || 0 : 0;
      const paid = Number(document.getElementById('reg-paid').value) || 0;
      const balance = Math.max(0, price - paid);
      document.getElementById('reg-balance').innerText = formatINR(balance);
    }

    async function handleRegisterSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('reg-submit-btn');
      btn.disabled = true;
      btn.innerText = 'Registering Member...';

      const select = document.getElementById('reg-plan');
      const opt = select.selectedOptions[0];
      const planPrice = Number(opt.dataset.price) || 0;
      const amountPaid = Number(document.getElementById('reg-paid').value) || 0;

      const payload = {
        fullName: document.getElementById('reg-name').value.trim(),
        phone: document.getElementById('reg-phone').value.trim(),
        email: document.getElementById('reg-email').value.trim() || undefined,
        gender: document.getElementById('reg-gender').value,
        planId: select.value,
        startDate: new Date().toISOString(),
        amountPaid: amountPaid,
        paymentMethod: document.getElementById('reg-method').value,
      };

      try {
        await API.createMember(payload);
        showToast('Member admitted successfully!');
        closeRegisterModal();
        loadMembers();
      } catch (err) {
        showToast(err.message || 'Failed to register member', 'error');
      } finally {
        btn.disabled = false;
        btn.innerText = 'Save & Register Member';
      }
    }

    // View Profile Modal
    async function viewMemberProfile(id) {
      const modal = document.getElementById('profile-modal');
      const content = document.getElementById('profile-modal-content');
      modal.classList.remove('hidden');
      content.innerHTML = '<p class="text-center text-slate-400 py-6">Loading details...</p>';

      try {
        const m = await API.getMember(id);
        const sub = m.activeMembership || {};
        content.innerHTML = `
          <div class="flex items-center gap-3 p-3 bg-slate-50 rounded-xl border border-slate-200">
            <div class="w-12 h-12 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-base">
              ${m.fullName ? m.fullName[0].toUpperCase() : 'M'}
            </div>
            <div>
              <h4 class="text-sm font-bold text-slate-900">${m.fullName}</h4>
              <p class="text-slate-500 font-mono">${m.memberId || 'ID: FC-MEMBER'}</p>
              <p class="text-slate-600">${m.phone || 'No phone'}</p>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2 p-3 bg-slate-50 rounded-xl border border-slate-200">
            <div>
              <p class="text-slate-400 font-bold uppercase text-[10px]">Gender</p>
              <p class="font-bold text-slate-800">${m.gender || 'MALE'}</p>
            </div>
            <div>
              <p class="text-slate-400 font-bold uppercase text-[10px]">Joined Date</p>
              <p class="font-bold text-slate-800">${formatDateIN(m.createdAt)}</p>
            </div>
          </div>

          <div class="p-3 bg-blue-50 border border-blue-200 rounded-xl">
            <p class="font-bold text-blue-900 mb-1">Active Membership</p>
            <p class="text-slate-700"><strong>Plan:</strong> ${sub.plan?.name || 'General'}</p>
            <p class="text-slate-700"><strong>Valid Until:</strong> ${formatDateIN(sub.endDate)}</p>
            <p class="text-slate-700"><strong>Status:</strong> <span class="font-bold text-blue-700">${m.status || 'ACTIVE'}</span></p>
          </div>
        `;
      } catch (err) {
        content.innerHTML = `<p class="text-center text-rose-500 py-4">Error loading profile details</p>`;
      }
    }
    function closeProfileModal() {
      document.getElementById('profile-modal').classList.add('hidden');
    }

    // Renew Modal
    function openRenewModal(memberId, name) {
      document.getElementById('renew-member-id').value = memberId;
      document.getElementById('renew-member-name').innerText = name;
      document.getElementById('renew-modal').classList.remove('hidden');
      handleRenewPlanChange();
    }
    function closeRenewModal() {
      document.getElementById('renew-modal').classList.add('hidden');
    }
    function handleRenewPlanChange() {
      const select = document.getElementById('renew-plan');
      const opt = select.selectedOptions[0];
      const price = opt ? Number(opt.dataset.price) || 0 : 0;
      document.getElementById('renew-paid').value = price;
    }
    async function handleRenewSubmit(e) {
      e.preventDefault();
      const memberId = document.getElementById('renew-member-id').value;
      const planId = document.getElementById('renew-plan').value;
      const amountPaid = Number(document.getElementById('renew-paid').value) || 0;
      const paymentMethod = document.getElementById('renew-method').value;
      const btn = document.getElementById('renew-btn');

      btn.disabled = true;
      btn.innerText = 'Processing...';

      try {
        await API.renewMembership({ memberId, planId, amountPaid, paymentMethod });
        showToast('Membership renewed successfully!');
        closeRenewModal();
        loadMembers();
      } catch (err) {
        showToast(err.message || 'Renewal failed', 'error');
      } finally {
        btn.disabled = false;
        btn.innerText = 'Confirm Renewal';
      }
    }
  </script>
</body>
</html>
